name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Smoke-test installed console scripts
        run: |
          cd "$(mktemp -d)"
          python - <<'PYCODE'
          import importlib.metadata
          import subprocess
          for ep in importlib.metadata.distribution("zarr-pyramid-audit").entry_points:
              if ep.group == "console_scripts":
                  subprocess.run([ep.name, "--help"], check=True)
          PYCODE
