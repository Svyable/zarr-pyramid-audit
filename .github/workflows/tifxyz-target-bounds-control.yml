name: TIFXYZ target-bounds control

on:
  pull_request:
    paths:
      - ".github/workflows/tifxyz-target-bounds-control.yml"
      - "src/zpa/tifxyz.py"
      - "src/zpa/report.py"
      - "src/zpa/data/*report.schema.json"
      - "tests/test_tifxyz.py"
      - "fixtures/tifxyz-target-bounds.expected.json"
      - "artifacts/2026-10-03-tifxyz-target-bounds-control/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ENDPOINT_URL_S3: https://s3.us-east-1.amazonaws.com
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Guard measured output
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/2026-10-03-tifxyz-target-bounds-control/tifxyz.reports.jsonl"
          if [ -e "$out" ]; then
            echo "target-bounds control already measured; frozen"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with TIFXYZ decoder
        if: steps.guard.outputs.skip != '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[tifxyz]'

      - name: Run exact-volume overrun control
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          zpa-tifxyz             --base s3://vesuvius-challenge-open-data/             --root PHerc0139/segments/20250108000001-w026_2025010854/mesh/20250108000001-on-20250820105138-2.403um.tifxyz             --content             --max-content-bytes 536870912             --expected-target-volume 20250820105138             --target-shape-zyx 19393 26105 26105             --workers 1             --out-dir artifacts/2026-10-03-tifxyz-target-bounds-control

      - name: Verify live control
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/2026-10-03-tifxyz-target-bounds-control/tifxyz.reports.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert len(rows) == 1
          report = rows[0]
          assert report["schema_version"] == "1.4.0"
          assert report["surface"]["meta"]["target_volume"]
          assert report["surface"]["target_shape_zyx"] == [19393, 26105, 26105]
          assert report["surface"]["target_overrun_points"] > 0
          codes = {f["code"] for f in report["findings"]}
          assert "TIFXYZ_TARGET_VOLUME_OVERRUN" in codes
          assert "TIFXYZ_NEGATIVE_COORDINATE" in codes
          print("target overrun points:", report["surface"]["target_overrun_points"])
          print("data bbox:", report["surface"]["data_bbox"])
          print("findings:", sorted(codes))
          PY

      - name: Record environment
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          python --version > artifacts/2026-10-03-tifxyz-target-bounds-control/environment.txt
          python -m pip freeze >> artifacts/2026-10-03-tifxyz-target-bounds-control/environment.txt

      - name: Commit measured control
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-10-03-tifxyz-target-bounds-control
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Measure exact-volume TIFXYZ bounds control"
          branch="${{ github.head_ref || github.ref_name }}"
          git push origin "HEAD:$branch"
